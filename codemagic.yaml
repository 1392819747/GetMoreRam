workflows:
  gmr:
    name: GetMoreRam IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
    scripts:
      - name: Build (official flow, unsigned)
        script: |
          xcodebuild clean build -scheme GetMoreRam -project GetMoreRam.xcodeproj             -sdk iphoneos -arch arm64 -configuration Release             CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA (ad-hoc sign)
        script: |
          APP=Build/Build/Products/Release-iphoneos/GetMoreRam.app
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -f GetMoreRam.ipa
          zip -qry GetMoreRam.ipa Payload -x "._*" -x ".DS_Store"
    artifacts:
      - GetMoreRam.ipa
